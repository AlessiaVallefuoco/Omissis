<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omissis — blur the face, keep the proof</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%235b8cff'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%23f5b942'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%232fd4b8'/%3E%3Crect x='17' y='17' width='13' height='13' rx='3' fill='%235b8cff' fill-opacity='.45'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script>
    /* Show any uncaught error on screen (useful when a browser misbehaves) */
    (function () {
      var seen = {};
      function show(msg) {
        if (!msg || seen[msg]) return;
        seen[msg] = 1;
        var box = document.getElementById('fatal');
        if (!box) { box = document.createElement('div'); box.id = 'fatal'; (document.body || document.documentElement).appendChild(box); }
        var line = document.createElement('div');
        line.textContent = msg;
        box.appendChild(line);
        box.style.display = 'block';
      }
      window.addEventListener('error', function (e) {
        show('Error: ' + (e.message || 'script error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('Error: ' + (r && r.message ? r.message : String(r)));
      });
    })();
  </script>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="13" height="13" rx="3.5" fill="#5b8cff"/>
        <rect x="17" y="2" width="13" height="13" rx="3.5" fill="#f5b942"/>
        <rect x="2" y="17" width="13" height="13" rx="3.5" fill="#2fd4b8"/>
        <rect x="17" y="17" width="13" height="13" rx="3.5" fill="#5b8cff" fill-opacity=".45"/>
      </svg>
      <div class="brand-text">
        <span class="wordmark">Omissis</span>
        <span class="tagline">Blur the face, keep the proof</span>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="Demo steps"></nav>
    <div class="net" id="net">
      <span class="net-dot" id="netDot"></span>
      <div class="net-text">
        <span class="net-label" id="netLabel">Connecting…</span>
        <span class="net-ledger mono" id="netLedger">ledger —</span>
      </div>
      <div class="seg" id="netSwitch" role="group" aria-label="Network">
        <button data-net="testnet">Testnet</button>
        <button data-net="sim">Offline</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="stage-col">
      <div class="stage" id="stage">
        <div class="frame" id="frame">
          <video id="video" playsinline muted autoplay></video>
          <canvas id="canvas" width="960" height="720"></canvas>
          <div class="tiles" id="tiles"></div>
          <div class="crop-box" id="cropBox"></div>
          <div class="hud hud-tl" id="hudTL"></div>
          <div class="hud hud-tr" id="hudTR"></div>
          <div class="hud hud-bl" id="hudBL"></div>
          <div class="flash" id="flash"></div>
          <div class="countdown" id="countdown" aria-live="assertive"></div>
          <div class="viewfinder" id="viewfinder"><i></i><i></i><i></i><i></i></div>
          <div class="empty" id="empty"></div>
        </div>
        <div class="diagram" id="diagram"></div>
        <div class="audit" id="audit"></div>
      </div>
      <div class="roll" id="roll"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <footer class="chain">
    <div class="chain-label">
      <span class="chain-title">XRP Ledger</span>
      <span class="chain-sub" id="chainSub">validated ledgers, live</span>
      <div class="legend">
        <span><i class="m-setup"></i>trust</span>
        <span><i class="m-cert"></i>sensor</span>
        <span><i class="m-register"></i>photo</span>
        <span><i class="m-revoke"></i>revoke</span>
      </div>
    </div>
    <div class="blocks" id="blocks"></div>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="drop-hint" id="dropHint"><div>Drop an Omissis PNG to verify it</div></div>
  <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" hidden>

  <script src="vendor/xrpl-latest-min.js"></script>
  <script src="vendor/pako.min.js"></script>
  <script src="js/png.js"></script>
  <script src="js/tessera.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
